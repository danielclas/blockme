name: Blockme
options:
  bundleIdPrefix: local.steadfast
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: 0.2.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
    SWIFT_VERSION: 6.0
targets:
  Blockme:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: AppSources/BlockmeApp
      - path: AppSources/Shared
      - path: AppResources
        buildPhase: resources
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - target: BlockmeFilter
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AppConfig/Blockme.entitlements
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_FILE: AppConfig/Blockme-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.steadfast.blockme
        PRODUCT_NAME: Blockme
  BlockmeFilter:
    type: system-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: AppSources/BlockmeFilterExtension
      - path: AppSources/Shared
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SystemExtension/BlockmeFilter.entitlements
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_FILE: SystemExtension/BlockmeFilter-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.steadfast.blockme.filter
        PRODUCT_NAME: BlockmeFilter
schemes:
  Blockme:
    build:
      targets:
        Blockme: all
        BlockmeFilter: all
    run:
      config: Debug
